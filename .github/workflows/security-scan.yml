name: Python Security Scan SAST+SCA
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install bandit safety

      - name: SAST Bandit static scan
        run: bandit -r ./ -f txt -o bandit-report.txt

      - name: SCA Safety dependency scan
        run: safety check > safety-report.txt

